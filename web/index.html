  <style>
    #app-loading {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
      background: #0E8A66;
      z-index: 9999;
    }
    #app-loading img {
      width: 160px;
      height: 160px;
      border-radius: 24px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.25);
    }
    #app-loading h1 {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 28px;
      font-weight: 700;
      color: #ffffff;
      text-align: center;
    }
    #app-loading p {
      margin: 0;
      max-width: 480px;
      padding: 0 24px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 14px;
      line-height: 1.5;
      color: rgba(255, 255, 255, 0.85);
      text-align: center;
    }
    #app-loading .spinner {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: 3px solid rgba(255, 255, 255, 0.35);
      border-top-color: #ffffff;
      animation: app-loading-spin 0.8s linear infinite;
    }
    @keyframes app-loading-spin {
      to { transform: rotate(360deg); }
    }
  </style>

<body>
  <!--
    Shown while the Flutter web engine downloads and initializes — this is
    the actual "blank white screen" gap that existed before any Flutter
    widget (including SplashPage) can render. Removed automatically on the
    documented `flutter-first-frame` event, Flutter web's own signal that
    the first real frame has painted.

    This markup is also this app's only real SEO payload: Flutter web renders
    the actual UI onto a <canvas> via CanvasKit, so once the app boots there is
    no indexable DOM text underneath it at all. Search engines that read raw
    HTML (Google's fast first-pass crawl, social-media link unfurlers, and any
    crawler that doesn't execute JS) only ever see what's written here — so it
    carries real heading/description text rather than being a bare spinner.
  -->
  <div id="app-loading">
    <img src="icons/Icon-512.png" alt="NavaSakhi logo">
    <h1>NavaSakhi</h1>
    <p>
      AI-Enabled Digital Platform for Self-Help Groups (SHGs) and Women-Led
      Microenterprises — savings, loans, meetings, livelihoods, marketplace,
      schemes and training, for SHG members, leaders and federations.
    </p>
    <div class="spinner"></div>
  </div>
  <noscript>
    <div style="max-width: 640px; margin: 40px auto; padding: 0 24px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; color: #1a1a1a;">
      <h1>NavaSakhi — Digital Platform for Self-Help Groups</h1>
      <p>
        NavaSakhi (SHG Saathi) is an AI-enabled digital platform that helps
        Self-Help Groups and women-led microenterprises manage savings, loans,
        meetings, livelihoods, marketplace, schemes and training. Please enable
        JavaScript to use the app.
      </p>
    </div>
  </noscript>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      document.getElementById('app-loading')?.remove();
    });
  </script>
